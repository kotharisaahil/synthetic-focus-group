name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: every example study validates and runs offline
        run: |
          for f in examples/*.yaml; do
            sfg validate "$f" || exit 1
            sfg run "$f" --mock --out /tmp/runs || exit 1
          done
