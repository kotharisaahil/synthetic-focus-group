[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthetic-focus-group"
version = "0.1.0"
description = "A multi-agent synthetic focus group: an AI moderator runs a discussion with sampled persona agents, then measures how trustworthy the output is."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saahil Kothari" }]
keywords = ["llm", "agents", "focus-group", "market-research", "synthetic-respondents"]
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
all = ["anthropic>=0.40", "openai>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
sfg = "sfg.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sfg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
